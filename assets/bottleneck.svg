<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A very capable model is held back by a narrow neck: the context it is given and its ability to validate its own work</title>
  <rect width="960" height="560" rx="16" fill="#0B0C0E"/>

  <!-- funnel body -->
  <path d="M130 70 H830 C830 190 545 205 535 290 V390 H425 V290 C415 205 130 190 130 70 Z" fill="#1D2025" stroke="#F2F4F5" stroke-opacity="0.45" stroke-width="2"/>
  <!-- neck highlight -->
  <path d="M425 290 H535 V390 H425 Z" fill="#B4442E"/>

  <!-- top: the model -->
  <text x="480" y="122" text-anchor="middle" font-size="30" font-weight="700" fill="#F2F4F5">A very capable model</text>
  <text x="480" y="154" text-anchor="middle" font-size="16" fill="#9AA0A6">Writes, plans and reasons well beyond what gets through</text>

  <!-- neck labels -->
  <text x="480" y="332" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#F2F4F5">THE NECK</text>
  <text x="480" y="356" text-anchor="middle" font-size="12" fill="#F2F4F5" fill-opacity="0.85">limits everything below</text>

  <g font-size="22" font-weight="700" fill="#F2F4F5">
    <line x1="545" y1="318" x2="640" y2="318" stroke="#B4442E" stroke-width="2"/>
    <text x="652" y="312">Context</text>
    <text x="652" y="338" font-size="14" font-weight="400" fill="#9AA0A6">what it can see</text>
    <line x1="415" y1="318" x2="320" y2="318" stroke="#B4442E" stroke-width="2"/>
    <text x="308" y="312" text-anchor="end">Validation</text>
    <text x="308" y="338" text-anchor="end" font-size="14" font-weight="400" fill="#9AA0A6">checking its own work</text>
  </g>

  <!-- output -->
  <line x1="480" y1="390" x2="480" y2="436" stroke="#B4442E" stroke-width="3"/>
  <path d="M470 430 L480 446 L490 430 Z" fill="#B4442E"/>
  <text x="480" y="474" text-anchor="middle" font-size="16" fill="#9AA0A6">Only a trickle of that ability reaches the work</text>

  <!-- Veistra -->
  <line x1="60" y1="504" x2="900" y2="504" stroke="#2A2D33"/>
  <g transform="translate(300 518) scale(1.5)">
    <rect width="24" height="24" rx="2.16" fill="#0B0C0E" stroke="#2A2D33" stroke-width="0.5"/>
    <path fill="#F2F4F5" d="M5.28 6.22H18.72V17.78H5.28ZM9.189 8.848V10.686H14.811V8.848ZM9.189 13.314V15.152H14.811V13.314Z"/>
  </g>
  <text x="346" y="541" font-size="18" font-weight="700" fill="#F2F4F5">Veistra widens the neck.</text>
</svg>
