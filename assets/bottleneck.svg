<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The bottleneck Veistra removes: an agent needs context going in and a way to check its work coming out</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9AA0A6"/>
    </marker>
    <marker id="arr-rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#B4442E"/>
    </marker>
    <marker id="arr-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F2F4F5"/>
    </marker>
  </defs>

  <rect width="960" height="600" rx="16" fill="#0B0C0E"/>

  <text x="480" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#F2F4F5">An agent is only as good as what it can see</text>
  <text x="480" y="72" text-anchor="middle" font-size="14" fill="#9AA0A6">It needs context going in, and a way to check its work coming out.</text>

  <!-- ============ Left: without Veistra ============ -->
  <rect x="30" y="96" width="435" height="476" rx="12" fill="#14161A" stroke="#2A2D33"/>
  <text x="52" y="128" font-size="13" font-weight="700" letter-spacing="1.5" fill="#B4442E">WITHOUT VEISTRA</text>
  <text x="52" y="150" font-size="16" font-weight="600" fill="#F2F4F5">You are the bottleneck</text>

  <rect x="60" y="172" width="355" height="80" rx="10" fill="none" stroke="#B4442E" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="237" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#F2F4F5">Context</text>
  <text x="237" y="226" text-anchor="middle" font-size="13" fill="#9AA0A6">You paste, describe and screenshot it by hand</text>

  <line x1="237" y1="252" x2="237" y2="296" stroke="#B4442E" stroke-width="2" marker-end="url(#arr-rust)"/>

  <rect x="60" y="300" width="355" height="80" rx="10" fill="#1D2025" stroke="#3A3E45"/>
  <text x="237" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#F2F4F5">Agent</text>
  <text x="237" y="354" text-anchor="middle" font-size="13" fill="#9AA0A6">Writes code without seeing the result</text>

  <line x1="237" y1="380" x2="237" y2="424" stroke="#B4442E" stroke-width="2" marker-end="url(#arr-rust)"/>

  <rect x="60" y="428" width="355" height="80" rx="10" fill="none" stroke="#B4442E" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="237" y="459" text-anchor="middle" font-size="16" font-weight="700" fill="#F2F4F5">Check</text>
  <text x="237" y="482" text-anchor="middle" font-size="13" fill="#9AA0A6">You run it, look, and report what went wrong</text>

  <path d="M415 468 H440 V340 H419" fill="none" stroke="#B4442E" stroke-width="2" marker-end="url(#arr-rust)"/>

  <text x="247" y="546" text-anchor="middle" font-size="14" font-weight="600" fill="#F2F4F5">Every loop waits on you.</text>

  <!-- ============ Right: with Veistra ============ -->
  <rect x="495" y="96" width="435" height="476" rx="12" fill="#14161A" stroke="#F2F4F5" stroke-opacity="0.35"/>
  <text x="517" y="128" font-size="13" font-weight="700" letter-spacing="1.5" fill="#F2F4F5">WITH VEISTRA</text>
  <text x="517" y="150" font-size="16" font-weight="600" fill="#F2F4F5">The agent closes the loop itself</text>

  <!-- the mark -->
  <g transform="translate(878 106) scale(1.8)">
    <rect width="24" height="24" rx="2.16" fill="#0B0C0E" stroke="#2A2D33" stroke-width="0.5"/>
    <path fill="#F2F4F5" d="M5.28 6.22H18.72V17.78H5.28ZM9.189 8.848V10.686H14.811V8.848ZM9.189 13.314V15.152H14.811V13.314Z"/>
  </g>

  <rect x="525" y="172" width="355" height="80" rx="10" fill="#F2F4F5"/>
  <text x="702" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#0B0C0E">Context</text>
  <text x="702" y="226" text-anchor="middle" font-size="13" fill="#3A3E45">Canvas designs, scenes, renders, logs, files</text>

  <line x1="702" y1="252" x2="702" y2="296" stroke="#F2F4F5" stroke-width="2" marker-end="url(#arr-paper)"/>

  <rect x="525" y="300" width="355" height="80" rx="10" fill="#1D2025" stroke="#F2F4F5" stroke-opacity="0.5"/>
  <text x="702" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#F2F4F5">Agent</text>
  <text x="702" y="354" text-anchor="middle" font-size="13" fill="#9AA0A6">Claude, Codex or Veistra's own harness</text>

  <line x1="702" y1="380" x2="702" y2="424" stroke="#F2F4F5" stroke-width="2" marker-end="url(#arr-paper)"/>

  <rect x="525" y="428" width="355" height="80" rx="10" fill="#F2F4F5"/>
  <text x="702" y="459" text-anchor="middle" font-size="16" font-weight="700" fill="#0B0C0E">Check</text>
  <text x="702" y="482" text-anchor="middle" font-size="13" fill="#3A3E45">Play runs and takes, viewer renders, canvas lint</text>

  <path d="M880 468 H905 V340 H884" fill="none" stroke="#B4442E" stroke-width="2.5" marker-end="url(#arr-rust)"/>

  <text x="712" y="546" text-anchor="middle" font-size="14" font-weight="600" fill="#F2F4F5">You review the result, not every step.</text>
</svg>
